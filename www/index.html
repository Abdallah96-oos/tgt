<style>
:root{--navy:#102a43;--blue:#1677ff;--teal:#11a683;--bg:#f4f7fb;--ink:#1c2d3f;--muted:#6b7c90;--line:#e3eaf2;--white:#fff;--orange:#f59e0b;--red:#e05252;--shadow:0 8px 28px #102a430b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#e8f0f8;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 26px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#38bdf8,#11a683);display:grid;place-items:center;color:white;font-size:22px;font-weight:800}.brand b{font-size:18px;display:block}.brand small{color:#a9bfd2}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#c4d4e2;text-align:right;padding:12px 13px;border-radius:11px;display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:#ffffff17;color:#fff}.nav .ico{width:24px;text-align:center;font-size:18px}.side-note{position:absolute;bottom:18px;right:18px;left:18px;color:#9fb4c8;font-size:12px;line-height:1.7;border-top:1px solid #ffffff1a;padding-top:14px}.main{min-width:0}.topbar{height:76px;background:#ffffffd9;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.topbar h2{font-size:19px;margin:0}.topbar p{margin:3px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.avatar{width:37px;height:37px;background:#e2f4f0;color:#087b61;border-radius:50%;display:grid;place-items:center;font-weight:800}.content{padding:26px 30px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.page-head h1{font-size:25px;margin:0 0 6px}.page-head p{color:var(--muted);margin:0;font-size:13px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:650;display:inline-flex;align-items:center;gap:7px;justify-content:center}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.green{background:var(--teal);border-color:var(--teal);color:white}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat,.panel,.table-wrap,.hero{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.stat-icon{width:38px;height:38px;border-radius:12px;background:#edf5ff;display:grid;place-items:center;font-size:19px}.stat strong{display:block;font-size:27px;margin-top:12px;letter-spacing:-.5px}.stat small{color:var(--muted);font-size:12px}.hero{padding:22px;background:linear-gradient(110deg,#102a43,#174b68);color:white;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}.hero h2{margin:0 0 7px;font-size:21px}.hero p{margin:0;color:#c4d9e8;font-size:13px}.hero .btn{border:0;white-space:nowrap}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{padding:18px;min-width:0}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panel-title h3{font-size:16px;margin:0}.panel-title span{color:var(--muted);font-size:12px}.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:13px}.empty b{display:block;color:var(--ink);margin:8px}.list{display:grid;gap:0}.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf1f6}.list-item:last-child{border-bottom:0}.round{width:39px;height:39px;flex:none;border-radius:12px;display:grid;place-items:center;background:#eff6ff;color:#2563eb;font-weight:800}.li-main{flex:1;min-width:0}.li-main b{display:block;font-size:13px}.li-main small{color:var(--muted);font-size:12px}.tag{font-size:11px;font-weight:700;padding:5px 8px;border-radius:99px;background:#edf7f4;color:#078567;white-space:nowrap}.tag.warn{background:#fff5dd;color:#a66a00}.tag.bad{background:#fff0f0;color:#c73c3c}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:180px;position:relative}.search input{width:100%}.field, input,select,textarea{border:1px solid #d9e2ec;border-radius:9px;padding:10px 11px;background:white;color:var(--ink);outline:none;width:100%}input:focus,select:focus,textarea:focus{border-color:#6aa7ff;box-shadow:0 0 0 3px #1677ff12}textarea{min-height:85px;resize:vertical}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:right;padding:13px 15px;border-bottom:1px solid #edf1f6;font-size:13px;white-space:nowrap}.table th{background:#f9fbfd;color:var(--muted);font-weight:700;font-size:12px}.table tr:last-child td{border-bottom:0}.table td b{font-weight:700}.subtext{color:var(--muted);font-size:12px}.actions{display:flex;gap:5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-group{display:grid;gap:6px}.form-group label{font-size:12px;color:#526579;font-weight:700}.form-group.full{grid-column:1/-1}.modal-back{position:fixed;inset:0;background:#0b1c2f75;z-index:10;display:none;align-items:center;justify-content:center;padding:15px}.modal-back.show{display:flex}.modal{background:white;border-radius:17px;width:min(620px,100%);max-height:calc(100vh - 30px);max-height:calc(100dvh - 30px);overflow:auto;padding:22px 22px 0;-webkit-overflow-scrolling:touch;box-shadow:0 24px 90px #00152c55}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-head h2{margin:0;font-size:19px}.close{border:0;background:#f0f3f7;border-radius:9px;width:34px;height:34px;font-size:21px}.modal-foot{display:flex;justify-content:flex-start;gap:8px;margin-top:14px;position:sticky;bottom:0;background:#fff;padding:12px 0 calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:2}.notice{background:#fff8e6;border:1px solid #f4e0a7;color:#805b0b;border-radius:11px;padding:12px 14px;font-size:12px;line-height:1.7;margin-bottom:16px}.toast{position:fixed;bottom:22px;left:22px;background:#102a43;color:white;padding:12px 18px;border-radius:11px;box-shadow:var(--shadow);z-index:20;display:none}.toast.show{display:block}.mobile-menu{display:none}.hide{display:none!important}
@media(max-width:950px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:8;right:0;top:0;width:250px;transform:translateX(105%);transition:.2s;box-shadow:-10px 0 40px #00152c33}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.topbar{padding:0 16px}.content{padding:20px 16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.side-note{position:static;margin-top:30px}}@media(max-width:560px){.topbar{height:65px}.topbar p{display:none}.page-head{align-items:flex-start;flex-direction:column}.page-head .btn{width:100%}.hero{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.stat-top{font-size:11px}.stat-icon{width:31px;height:31px}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.content{padding:16px 12px}.panel{padding:13px}}
@media(max-width:950px){.modal-back{align-items:flex-start;padding:10px}}.pbar{height:12px;background:#e6edf5;border-radius:99px;overflow:hidden;margin:6px 0 10px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px}.bottom,.fab{display:none}
@media(max-width:950px){.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:7;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}.bottom button{border:0;background:none;display:grid;gap:2px;justify-items:center;font:inherit;font-size:11px;color:var(--muted);padding:4px 10px}.bottom button.active{color:var(--blue);font-weight:700}.bottom i{font-style:normal;font-size:19px}.fab{display:block;position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));left:16px;z-index:7;width:54px;height:54px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:28px;box-shadow:0 8px 20px #11a68355}.content{padding-bottom:150px}}
</style>

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">T</div><div><b>TGT</b><small>مساعد المندوب</small></div></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>الرئيسية</button>
    <button data-page="customers"><span class="ico">♙</span>العملاء</button>
    <button data-page="visits"><span class="ico">⌖</span>الزيارات</button>
    <button data-page="tasks"><span class="ico">◷</span>المهام والتذكيرات</button>
    <button data-page="orders"><span class="ico">▤</span>الطلبات والفواتير</button>
    <button data-page="products"><span class="ico">◇</span>المنتجات</button>
    <button data-page="target"><span class="ico">◎</span>التارجت والعمولة</button><button data-page="reports"><span class="ico">▥</span>التقارير</button>
    <button data-page="settings"><span class="ico">⚙</span>الإعدادات والبيانات</button>
  </nav>
  <div class="side-note">TGT 1.0<br>بياناتك محفوظة على جهازك فقط.</div>
</aside>
<main class="main">
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><div><h2 id="topTitle">الرئيسية</h2><p id="today"></p></div></div><div class="top-actions"><button class="btn" id="quickTask">＋ تذكير</button><div class="avatar">م</div></div></header>
<section class="content" id="content"></section>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h2 id="modalTitle">إضافة</h2><button class="close" id="closeModal">×</button></div><form id="modalForm"><div id="modalBody"></div><div class="modal-foot"><button class="btn primary" type="submit">حفظ البيانات</button><button class="btn" type="button" id="cancelModal">إلغاء</button></div></form></div></div>
<nav class="bottom" id="bottom"><button data-page="dashboard"><i>▦</i>الرئيسية</button><button data-page="customers"><i>♙</i>العملاء</button><button data-page="visits"><i>⌖</i>الزيارات</button><button data-page="tasks"><i>◷</i>المهام</button><button data-page="target"><i>◎</i>التارجت</button></nav><button class="fab" id="fab" aria-label="تسجيل زيارة">＋</button><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'}):'—';
const money=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(Number(n||0))+' ر.س';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const initial={customers:[],visits:[],tasks:[],products:[],orders:[],payments:[],settings:{}};
let db=load(),page='dashboard',query='',modalSave=null;
function load(){try{return {...initial,...JSON.parse(localStorage.getItem('tgt_db')||'{}')}}catch(e){return {...initial}}}
function save(){try{localStorage.setItem('tgt_db',JSON.stringify(db))}catch(e){toast('تعذّر الحفظ الدائم على هذا الجهاز')}render();syncReminders()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
const pageNames={dashboard:'الرئيسية',customers:'العملاء',visits:'الزيارات',tasks:'المهام والتذكيرات',orders:'الطلبات والفواتير',target:'التارجت والعمولة',products:'المنتجات',reports:'التقارير',settings:'الإعدادات والبيانات'};
$('#today').textContent=new Date().toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;query='';$('#sidebar').classList.remove('open');$$('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#closeModal').onclick=$('#cancelModal').onclick=closeModal;
$('#quickTask').onclick=()=>openTask();

const digits=s=>String(s||'').replace(/\D/g,'');
const waNum=s=>{let d=digits(s);return d.startsWith('00')?d.slice(2):d.startsWith('0')?'966'+d.slice(1):d};
const NP=window.Capacitor&&window.Capacitor.Plugins||{};
$('#bottom').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;query='';render()});
$('#fab').onclick=()=>openVisit();
function openProfile(c){
 let ev=[...db.visits.filter(v=>v.customer===c.name).map(v=>({d:v.date,t:'⌖ '+(v.kind||'زيارة')+' — '+(v.result||''),s:v.next||v.notes||''})),
  ...db.orders.filter(o=>o.customer===c.name).map(o=>({d:o.due||'',t:'▤ '+(o.kind||'')+' '+(o.number||'')+' — '+money(o.amount),s:'مدفوع '+money(o.paid)})),
  ...db.tasks.filter(t=>t.customer===c.name).map(t=>({d:t.date,t:'◷ '+t.title,s:t.status}))].sort((a,b)=>(b.d||'').localeCompare(a.d||''));
 let ph=digits(c.phone);
 let links=(ph?`<a class="btn small" href="tel:${ph}">اتصال</a><a class="btn small" target="_blank" rel="noopener" href="https://wa.me/${waNum(c.phone)}?text=${encodeURIComponent('مرحبًا '+(c.contact||c.name)+'، ')}">واتساب</a>`:'')+(c.address?`<a class="btn small" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.address)}">الخريطة</a>`:'');
 openModal(c.name,`<div class="form-group full"><div class="subtext">${esc(c.type||'')} · ${esc(c.status||'')} · ${esc(c.contact||'')}</div><div class="actions" style="margin-top:8px">${links}</div></div><div class="form-group full"><label>السجل الزمني</label>${ev.map(e=>`<div class="subtext" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(e.t)}</b><br>${esc(e.d||'')} ${esc(e.s||'')}</div>`).join('')||'<div class="subtext">لا يوجد سجل بعد. سجّل أول زيارة لهذا العميل.</div>'}</div>`,()=>{})}
async function shareFile(name,txt,mime){let FS=NP.Filesystem,SH=NP.Share;if(FS&&SH){try{let r=await FS.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});await SH.share({title:name,url:r.uri})}catch(e){}return}
 let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز الملف')}
function exportData(){shareFile('tgt-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2),'application/json')}
function exportCSV(){let q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';let rows=[['الاسم','المسؤول','الهاتف','النشاط','العنوان','الحالة','ملاحظات'],...db.customers.map(c=>[c.name,c.contact,c.phone,c.type,c.address,c.status,c.notes])];shareFile('tgt-customers-'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
async function syncReminders(){let LN=NP.LocalNotifications;if(!LN)return;try{let p=await LN.checkPermissions();if(p.display!=='granted'){p=await LN.requestPermissions();if(p.display!=='granted')return}
 let pe=await LN.getPending();if(pe.notifications.length)await LN.cancel({notifications:pe.notifications});
 let now=Date.now(),n=db.tasks.filter(t=>t.status!=='تمت'&&t.date).map(t=>({id:Math.abs([...String(t.id)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%2147483000+1,title:'TGT — تذكير',body:t.title+(t.customer&&t.customer!=='بدون عميل'?' · '+t.customer:''),schedule:{at:new Date(t.date+'T09:00:00')}})).filter(x=>x.schedule.at>now).slice(0,60);
 if(n.length)await LN.schedule({notifications:n})}catch(e){}}

let tgtMonth=new Date().toISOString().slice(0,7);
function shiftM(d){let [y,m]=tgtMonth.split('-').map(Number);m+=d;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;tgtMonth=y+'-'+String(m).padStart(2,'0');render()}
function tgtCalc(m){let s=db.settings||{},T=+s.target||0,r=+s.rate||0,b=+s.bonus||0,basis=s.basis||'sales',cur=new Date().toISOString().slice(0,7);
 let os=db.orders.filter(o=>o.kind!=='عرض سعر'&&o.status!=='ملغي'&&(o.date||cur+'-01').slice(0,7)===m);
 let sales=os.reduce((a,o)=>a+o.amount,0),paid=os.reduce((a,o)=>a+o.paid,0),base=basis==='paid'?paid:sales;
 let [y,mo]=m.split('-').map(Number),dim=new Date(y,mo,0).getDate(),left=m===cur?dim-new Date().getDate()+1:0;
 return {T,r,b,basis,base,n:os.length,com:base*r/100+Math.max(0,base-T)*b/100,pct:T?base/T*100:0,rem:Math.max(0,T-base),left,daily:left?Math.max(0,T-base)/left:0,atT:T*r/100}}
function openTarget(){let s=db.settings||{};openModal('ضبط التارجت والعمولة',field('التارجت الشهري (ر.س)','target','number',s.target||0)+field('نسبة العمولة %','rate','number',s.rate||0)+field('نسبة إضافية على ما فوق التارجت %','bonus','number',s.bonus||0)+field('أساس الحساب','basis','select',s.basis==='paid'?'المحصّل فقط':'المبيعات المسجلة',['المبيعات المسجلة','المحصّل فقط']),d=>{db.settings={target:+d.target||0,rate:+d.rate||0,bonus:+d.bonus||0,basis:d.basis==='المحصّل فقط'?'paid':'sales'};save();toast('تم حفظ التارجت')})}
function targetPage(){let c=tgtCalc(tgtMonth),lbl=new Date(tgtMonth+'-01T12:00:00').toLocaleDateString('ar-u-ca-gregory',{month:'long',year:'numeric'});
 return `<div class="page-head"><div><h1>التارجت والعمولة</h1><p>${lbl} — محسوب من الطلبات والفواتير المسجلة (عروض الأسعار لا تُحتسب).</p></div><button class="btn primary" id="tgtSet">⚙ ضبط التارجت</button></div><div class="actions" style="margin-bottom:12px"><button class="btn small" id="tgtPrev">‹ الشهر السابق</button><button class="btn small" id="tgtNext">الشهر التالي ›</button></div>${c.T?'':'<div class="notice" style="margin-bottom:12px">اضبط التارجت الشهري ونسبة عمولتك أولًا ليبدأ الحساب.</div>'}<div class="stats">${cardStat('التارجت',money(c.T),'◎')}${cardStat(c.basis==='paid'?'المحصّل':'المبيعات',money(c.base),'▤',c.n+' مستند')}${cardStat('نسبة التحقق',c.pct.toFixed(0)+'%','%')}${cardStat('عمولتك الحالية',money(c.com),'✓','بنسبة '+c.r+'%')}</div><div class="panel" style="margin-top:14px"><div class="panel-title"><h3>التقدم نحو التارجت</h3></div><div class="pbar"><i style="width:${Math.min(100,c.pct)}%"></i></div><p class="subtext">${c.T&&c.pct>=100?'حققت التارجت، وما فوقه يُحسب بنسبة '+c.b+'% إضافية.':'متبقي '+money(c.rem)+(c.left?' — تحتاج '+money(c.daily)+' يوميًا لمدة '+c.left+' يوم.':'')}</p><p class="subtext">لو حققت التارجت بالكامل تكون عمولتك ${money(c.atT)}.</p></div>`}
function targetMini(){let c=tgtCalc(new Date().toISOString().slice(0,7));if(!c.T)return '<div class="notice" style="margin-bottom:14px">حدد تارجتك الشهري ونسبة عمولتك <button class="btn small" data-goto="target">ابدأ</button></div>';return `<div class="panel" style="margin-bottom:14px"><div class="panel-title"><h3>◎ تارجت الشهر</h3><button class="btn small" data-goto="target">التفاصيل</button></div><div class="pbar"><i style="width:${Math.min(100,c.pct)}%"></i></div><p class="subtext">${c.pct.toFixed(0)}% — ${money(c.base)} من ${money(c.T)} · عمولتك ${money(c.com)}</p></div>`}
function closeModal(){$('#modalBack').classList.remove('show');modalSave=null}
function field(label,name,type='text',value='',opts=null,required=false){let el='';if(type==='select'){el=`<select name="${name}" ${required?'required':''}>${(opts||[]).map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`}else if(type==='textarea'){el=`<textarea name="${name}" placeholder="${label}">${esc(value)}</textarea>`}else{el=`<input name="${name}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(value)}" placeholder="${label}" ${required?'required':''}>`}return `<div class="form-group"><label>${label}${required?' *':''}</label>${el}</div>`}
function openModal(title,body,onSave){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=`<div class="form-grid">${body}</div>`;modalSave=onSave;$('#modalBack').classList.add('show')}
$('#modalForm').onsubmit=e=>{e.preventDefault();if(!modalSave)return;const d=Object.fromEntries(new FormData(e.target).entries());modalSave(d);closeModal()};
function openCustomer(c={}){openModal(c.id?'تعديل بيانات العميل':'إضافة عميل جديد',field('اسم العميل / المنشأة','name','text',c.name,'',true)+field('اسم المسؤول','contact','text',c.contact||'')+field('رقم الهاتف','phone','tel',c.phone||'')+field('نوع النشاط','type','select',c.type||'شركة',['شركة','محل تجاري','مستشفى','صيدلية','موزع','فرد','أخرى'])+field('المدينة والعنوان','address','text',c.address||'')+field('حالة العميل','status','select',c.status||'محتمل',['محتمل','نشط','غير نشط','موقوف'])+`<div class="form-group full">${field('ملاحظات','notes','textarea',c.notes||'')}</div>`,d=>{let x={...c,...d,updatedAt:todayISO()};if(!x.id)x.id=uid();if(c.id)db.customers=db.customers.map(a=>a.id===c.id?x:a);else db.customers.unshift(x);save();toast('تم حفظ بيانات العميل')})}
function openVisit(v={}){let customers=db.customers.map(c=>c.name);if(!customers.length){toast('أضف عميلًا أولًا');return}openModal('تسجيل زيارة',field('العميل','customer','select',v.customer||customers[0],customers,true)+field('تاريخ الزيارة','date','date',v.date||todayISO(),'',true)+field('نوع الزيارة','kind','select',v.kind||'زيارة ميدانية',['زيارة ميدانية','مكالمة','واتساب','اجتماع أونلاين'])+field('النتيجة','result','select',v.result||'تمت الزيارة',['تمت الزيارة','طلب عرض سعر','طلب جديد','مهتم','يحتاج متابعة','رفض','لم يكن موجودًا'])+field('الخطوة التالية','next','text',v.next||'')+field('موعد المتابعة','followDate','date',v.followDate||'')+`<div class="form-group full">${field('تفاصيل وملاحظات','notes','textarea',v.notes||'')}</div>`,d=>{let x={...v,...d,id:v.id||uid()};db.visits.unshift(x);if(d.followDate&&d.next)db.tasks.unshift({id:uid(),title:d.next,customer:d.customer,date:d.followDate,status:'مفتوحة',notes:'متابعة ناتجة عن زيارة'});save();toast('تم تسجيل الزيارة والمتابعة')})}
function openTask(t={}){openModal(t.id?'تعديل المهمة':'إضافة تذكير / مهمة',field('عنوان المهمة','title','text',t.title||'','',true)+field('العميل المرتبط','customer','select',t.customer||'بدون عميل',['بدون عميل',...db.customers.map(c=>c.name)])+field('الموعد','date','date',t.date||todayISO(),' ',true)+field('الأولوية','priority','select',t.priority||'عادية',['عاجلة','عالية','عادية'])+field('الحالة','status','select',t.status||'مفتوحة',['مفتوحة','تمت','مؤجلة'])+`<div class="form-group full">${field('ملاحظات','notes','textarea',t.notes||'')}</div>`,d=>{let x={...t,...d,id:t.id||uid()};if(t.id)db.tasks=db.tasks.map(a=>a.id===t.id?x:a);else db.tasks.unshift(x);save();toast('تم حفظ المهمة')})}
function openProduct(p={}){openModal(p.id?'تعديل المنتج':'إضافة منتج',field('اسم المنتج / الخدمة','name','text',p.name||'','',true)+field('الكود','sku','text',p.sku||'')+field('التصنيف','category','text',p.category||'')+field('سعر البيع (ر.س)','price','number',p.price||0)+field('الوحدة','unit','select',p.unit||'قطعة',['قطعة','عبوة','كرتونة','جهاز','خدمة','أخرى'])+field('الحالة','status','select',p.status||'متاح',['متاح','غير متاح']),d=>{let x={...p,...d,price:Number(d.price||0),id:p.id||uid()};if(p.id)db.products=db.products.map(a=>a.id===p.id?x:a);else db.products.unshift(x);save();toast('تم حفظ المنتج')})}
function openOrder(o={}){let customers=db.customers.map(c=>c.name);if(!customers.length){toast('أضف عميلًا أولًا');return}openModal('تسجيل طلب / فاتورة',field('العميل','customer','select',o.customer||customers[0],customers,true)+field('رقم المستند','number','text',o.number||('TGT-'+Date.now().toString().slice(-5)))+field('تاريخ المستند','date','date',o.date||todayISO())+field('النوع','kind','select',o.kind||'طلب',['طلب','فاتورة','عرض سعر'])+field('القيمة (ر.س)','amount','number',o.amount||0,'',true)+field('المدفوع (ر.س)','paid','number',o.paid||0)+field('تاريخ الاستحقاق','due','date',o.due||'')+field('الحالة','status','select',o.status||'جديد',['جديد','قيد المتابعة','مؤكد','تم التسليم','مدفوع','متأخر','ملغي'])+`<div class="form-group full">${field('ملاحظات','notes','textarea',o.notes||'')}</div>`,d=>{let x={...o,...d,amount:Number(d.amount||0),paid:Number(d.paid||0),id:o.id||uid()};if(o.id)db.orders=db.orders.map(a=>a.id===o.id?x:a);else db.orders.unshift(x);save();toast('تم حفظ المستند')})}
function cardStat(label,value,icon,note=''){return `<div class="stat"><div class="stat-top"><span>${label}</span><div class="stat-icon">${icon}</div></div><strong>${value}</strong><small>${note}</small></div>`}
function empty(msg){return `<div class="empty">✦<b>${msg}</b>ابدأ بإضافة بياناتك، وستظهر هنا تلقائيًا.</div>`}
function customerName(n){return db.customers.find(c=>c.name===n)?.name||n||'—'}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function filterbar(placeholder,addLabel,addFn){return `<div class="toolbar"><div class="search"><input id="searchBox" placeholder="${placeholder}" value="${esc(query)}"></div><button class="btn primary" id="addBtn">＋ ${addLabel}</button></div>`}
function attachSearch(){let s=$('#searchBox');if(s)s.oninput=e=>{query=e.target.value;renderKeepFocus()};let a=$('#addBtn');if(a)a.onclick=()=>{let map={customers:openCustomer,visits:openVisit,tasks:openTask,products:openProduct,orders:openOrder};map[page]?.()}}
function renderKeepFocus(){let pos=$('#searchBox')?.selectionStart;render();let s=$('#searchBox');if(s){s.focus();s.setSelectionRange(pos,pos)}}
function dashboard(){let due=db.tasks.filter(t=>t.status!=='تمت'&&t.date<=todayISO()).length;let visits=db.visits.filter(v=>v.date===todayISO()).length;let sales=db.orders.filter(o=>o.kind!=='عرض سعر'&&o.status!=='ملغي').reduce((s,o)=>s+Number(o.amount||0),0);let receivables=db.orders.reduce((s,o)=>s+Math.max(0,Number(o.amount||0)-Number(o.paid||0)),0);let recent=db.visits.slice(0,5).map(v=>`<div class="list-item"><div class="round">⌖</div><div class="li-main"><b>${esc(v.customer)}</b><small>${esc(v.result)} · ${fmtDate(v.date)}</small></div><span class="tag">${esc(v.kind)}</span></div>`).join('')||empty('لا توجد زيارات مسجلة');let tasks=db.tasks.filter(t=>t.status!=='تمت').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(t=>`<div class="list-item"><div class="round">◷</div><div class="li-main"><b>${esc(t.title)}</b><small>${esc(t.customer||'بدون عميل')} · ${fmtDate(t.date)}</small></div><span class="tag ${t.date<todayISO()?'bad':t.date===todayISO()?'warn':''}">${t.date<todayISO()?'متأخرة':t.date===todayISO()?'اليوم':'قادمة'}</span><button class="btn small" data-done="${t.id}">✓</button></div>`).join('')||empty('لا توجد مهام مفتوحة');return `<div class="page-head"><div><h1>أهلًا بيك 👋</h1><p>كل تفاصيل شغلك ومتابعاتك في مكان واحد.</p></div><button class="btn primary" id="dashVisit">＋ تسجيل زيارة</button></div><div class="hero"><div><h2>خلّي كل زيارة ليها خطوة تالية</h2><p>سجّل ملاحظاتك وحدد موعد المتابعة قبل ما تنتقل للعميل التالي.</p></div><button class="btn" id="dashCustomer">＋ إضافة عميل</button></div><div class="stats">${cardStat('إجمالي العملاء',db.customers.length,'♙','كل العملاء المسجلين')}${cardStat('زيارات اليوم',visits,'⌖','الزيارات المسجلة بتاريخ اليوم')}${cardStat('مهام تحتاج متابعة',due,'◷','المفتوحة المستحقة اليوم أو قبلها')}${cardStat('قيمة المستندات',money(sales),'▤','طلبات وفواتير غير ملغاة')}</div><div class="grid2"><div class="panel"><div class="panel-title"><h3>آخر الزيارات</h3><button class="btn small" data-goto="visits">عرض الكل ←</button></div><div class="list">${recent}</div></div><div class="panel"><div class="panel-title"><h3>المتابعات القادمة</h3><button class="btn small" data-goto="tasks">عرض الكل ←</button></div><div class="list">${tasks}</div></div></div><div class="panel" style="margin-top:16px"><div class="panel-title"><h3>ملخص سريع</h3><span>قيمة غير محصلة مسجلة</span></div><strong style="font-size:24px">${money(receivables)}</strong><p class="subtext">القيمة محسوبة من المستندات المسجلة فقط، وليست كشف حساب محاسبي رسمي.</p></div>`}
function customersPage(){let arr=db.customers.filter(c=>(c.name+' '+c.contact+' '+c.phone+' '+c.address+' '+c.type).toLowerCase().includes(query.toLowerCase()));let rows=arr.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="subtext">${esc(c.contact||'بدون مسؤول')}</div></td><td>${esc(c.type)}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.address||'—')}</td><td><span class="tag ${c.status==='غير نشط'?'warn':''}">${esc(c.status||'محتمل')}</span></td><td><div class="actions"><button class="btn small" data-prof-c="${c.id}">ملف</button><button class="btn small" data-edit-c="${c.id}">تعديل</button><button class="btn small" data-visit-c="${c.id}">زيارة</button><button class="btn small danger" data-del-c="${c.id}">حذف</button></div></td></tr>`).join('');return `<div class="page-head"><div><h1>العملاء</h1><p>قاعدة بيانات عملائك وسجل التواصل معهم.</p></div><button class="btn primary" id="addBtn">＋ إضافة عميل</button></div>${filterbar('ابحث بالاسم أو الهاتف أو العنوان...','إضافة عميل')} ${arr.length?table(['العميل','نوع النشاط','الهاتف','العنوان','الحالة','إجراءات'],rows):empty(query?'لا توجد نتائج مطابقة':'لا يوجد عملاء بعد')}`}
function visitsPage(){let arr=db.visits.filter(v=>(v.customer+' '+v.result+' '+v.notes+' '+v.kind).toLowerCase().includes(query.toLowerCase()));let rows=arr.map(v=>`<tr><td>${fmtDate(v.date)}</td><td><b>${esc(v.customer)}</b></td><td>${esc(v.kind)}</td><td>${esc(v.result)}</td><td>${esc(v.next||'—')}<div class="subtext">${v.followDate?fmtDate(v.followDate):''}</div></td><td><button class="btn small danger" data-del-v="${v.id}">حذف</button></td></tr>`).join('');return `<div class="page-head"><div><h1>الزيارات</h1><p>سجل كل مقابلة ونتيجتها والخطوة التالية.</p></div><button class="btn primary" id="addBtn">＋ تسجيل زيارة</button></div>${filterbar('ابحث في الزيارات والملاحظات...','تسجيل زيارة')} ${arr.length?table(['التاريخ','العميل','النوع','النتيجة','المتابعة','إجراء'],rows):empty('لا توجد زيارات مسجلة')}`}
function tasksPage(){let arr=db.tasks.filter(t=>(t.title+' '+t.customer+' '+t.notes+' '+t.status).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>a.date.localeCompare(b.date));let rows=arr.map(t=>`<tr><td>${fmtDate(t.date)}</td><td><b>${esc(t.title)}</b><div class="subtext">${esc(t.notes||'')}</div></td><td>${esc(t.customer||'—')}</td><td><span class="tag ${t.status==='تمت'?'':'warn'}">${esc(t.status)}</span></td><td><span class="tag ${t.date<todayISO()&&t.status!=='تمت'?'bad':''}">${t.status==='تمت'?'مكتملة':t.date<todayISO()?'متأخرة':t.date===todayISO()?'اليوم':'قادمة'}</span></td><td><div class="actions"><button class="btn small" data-edit-t="${t.id}">تعديل</button>${t.status!=='تمت'?`<button class="btn small" data-done="${t.id}">إنجاز ✓</button>`:''}<button class="btn small danger" data-del-t="${t.id}">حذف</button></div></td></tr>`).join('');return `<div class="page-head"><div><h1>المهام والتذكيرات</h1><p>تابع مواعيد الزيارات والمكالمات والعروض المستحقة.</p></div><button class="btn primary" id="addBtn">＋ إضافة تذكير</button></div>${filterbar('ابحث عن مهمة أو عميل...','إضافة تذكير')} ${arr.length?table(['الموعد','المهمة','العميل','الحالة','التوقيت','إجراءات'],rows):empty('لا توجد مهام مسجلة')}<div class="notice" style="margin-top:14px">التذكيرات تصلك كإشعار على الموبايل الساعة 9 صباحًا من يوم الموعد.</div>`}
function ordersPage(){let arr=db.orders.filter(o=>(o.customer+' '+o.number+' '+o.kind+' '+o.status).toLowerCase().includes(query.toLowerCase()));let rows=arr.map(o=>`<tr><td><b>${esc(o.number)}</b><div class="subtext">${esc(o.kind)}</div></td><td>${esc(o.customer)}</td><td>${money(o.amount)}</td><td>${money(o.paid)}</td><td>${money(Math.max(0,o.amount-o.paid))}</td><td>${o.due?fmtDate(o.due):'—'}</td><td><span class="tag ${o.status==='متأخر'?'bad':''}">${esc(o.status)}</span></td><td><div class="actions"><button class="btn small" data-edit-o="${o.id}">تعديل</button><button class="btn small danger" data-del-o="${o.id}">حذف</button></div></td></tr>`).join('');return `<div class="page-head"><div><h1>الطلبات والفواتير</h1><p>تسجيل مبسط للمستندات والمدفوعات والمتبقي.</p></div><button class="btn primary" id="addBtn">＋ مستند جديد</button></div>${filterbar('ابحث برقم المستند أو اسم العميل...','مستند جديد')} ${arr.length?table(['رقم المستند','العميل','القيمة','المدفوع','المتبقي','الاستحقاق','الحالة','إجراءات'],rows):empty('لا توجد مستندات مسجلة')}<div class="notice" style="margin-top:14px">هذا سجل متابعة داخلي فقط، وليس نظامًا لإصدار الفواتير الإلكترونية المعتمدة أو بديلًا عن برنامج محاسبي.</div>`}
function productsPage(){let arr=db.products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(query.toLowerCase()));let rows=arr.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.sku||'—')}</td><td>${esc(p.category||'—')}</td><td>${money(p.price)}</td><td>${esc(p.unit)}</td><td><div class="actions"><button class="btn small" data-edit-p="${p.id}">تعديل</button><button class="btn small danger" data-del-p="${p.id}">حذف</button></div></td></tr>`).join('');return `<div class="page-head"><div><h1>المنتجات والخدمات</h1><p>كتالوج بسيط قابل للتخصيص حسب نشاطك.</p></div><button class="btn primary" id="addBtn">＋ إضافة منتج</button></div>${filterbar('ابحث عن منتج أو كود...','إضافة منتج')} ${arr.length?table(['المنتج','الكود','التصنيف','السعر','الوحدة','إجراءات'],rows):empty('لا توجد منتجات مسجلة')}`}
function reportsPage(){let total=db.orders.filter(o=>o.kind!=='عرض سعر'&&o.status!=='ملغي').reduce((s,o)=>s+o.amount,0),paid=db.orders.reduce((s,o)=>s+o.paid,0),due=db.orders.reduce((s,o)=>s+Math.max(0,o.amount-o.paid),0),done=db.tasks.filter(t=>t.status==='تمت').length;return `<div class="page-head"><div><h1>التقارير</h1><p>ملخص مباشر من البيانات التي أدخلتها.</p></div><button class="btn" id="exportBtn">⇩ تصدير نسخة احتياطية</button></div><div class="stats">${cardStat('عدد العملاء',db.customers.length,'♙')}${cardStat('الزيارات المسجلة',db.visits.length,'⌖')}${cardStat('قيمة الطلبات والفواتير',money(total),'▤')}${cardStat('المبالغ المحصلة',money(paid),'✓')}</div><div class="grid2"><div class="panel"><div class="panel-title"><h3>ملخص المبيعات والتحصيل</h3></div><div class="list"><div class="list-item"><div class="li-main"><b>قيمة المستندات (باستثناء العروض والملغاة)</b></div><strong>${money(total)}</strong></div><div class="list-item"><div class="li-main"><b>المدفوع المسجل</b></div><strong>${money(paid)}</strong></div><div class="list-item"><div class="li-main"><b>المتبقي المسجل</b></div><strong>${money(due)}</strong></div></div></div><div class="panel"><div class="panel-title"><h3>نشاط المتابعة</h3></div><div class="list"><div class="list-item"><div class="li-main"><b>كل الزيارات</b></div><strong>${db.visits.length}</strong></div><div class="list-item"><div class="li-main"><b>المهام المكتملة</b></div><strong>${done}</strong></div><div class="list-item"><div class="li-main"><b>المهام المفتوحة</b></div><strong>${db.tasks.filter(t=>t.status!=='تمت').length}</strong></div></div></div></div><div class="notice" style="margin-top:16px">التقارير أولية وتعتمد على اكتمال البيانات التي أدخلتها يدويًا. لا تمثل قوائم مالية معتمدة.</div>`}
function settingsPage(){return `<div class="page-head"><div><h1>الإعدادات والبيانات</h1><p>تحكم في نسخة البيانات واحتفظ بنسخة احتياطية.</p></div></div><div class="notice">النسخة الحالية تحفظ البيانات محليًا في المتصفح على هذا الجهاز. لا يوجد حساب مستخدم أو مزامنة سحابية. لا تستخدمها بعد لحفظ بيانات شديدة الحساسية أو باعتبارها نسخة احتياطية وحيدة.</div><div class="grid2"><div class="panel"><div class="panel-title"><h3>النسخ الاحتياطي</h3></div><p class="subtext">نزّل نسخة JSON تشمل العملاء والزيارات والمهام والمنتجات والمستندات.</p><button class="btn primary" id="exportBtn">⇩ تنزيل نسخة احتياطية</button><button class="btn" id="csvBtn">⇩ تصدير العملاء CSV</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><label class="btn" for="importFile">⇧ استعادة نسخة احتياطية</label><input id="importFile" type="file" accept=".json,application/json" class="hide"></div><div class="panel"><div class="panel-title"><h3>إدارة البيانات</h3></div><p class="subtext">امسح كل البيانات المحلية. هذا الإجراء لا يمكن التراجع عنه إلا من نسخة احتياطية.</p><button class="btn danger" id="clearData">حذف جميع البيانات</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p class="subtext">TGT Prototype · إصدار 0.1</p></div></div>`}
function render(){ $('#topTitle').textContent=pageNames[page];$$('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));let fn={dashboard:()=>targetMini()+dashboard(),target:targetPage,customers:customersPage,visits:visitsPage,tasks:tasksPage,orders:ordersPage,products:productsPage,reports:reportsPage,settings:settingsPage};$('#content').innerHTML=fn[page]();attachSearch();wire()}
function wire(){
let bind=(id,fn)=>{let el=$(id);if(el)el.onclick=fn};
bind('#tgtSet',openTarget);bind('#tgtPrev',()=>shiftM(-1));bind('#tgtNext',()=>shiftM(1));bind('#dashVisit',()=>openVisit());bind('#dashCustomer',()=>openCustomer());bind('#exportBtn',exportData);bind('#csvBtn',exportCSV);
$$('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;query='';$$('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render()});
$$('[data-edit-c]').forEach(b=>b.onclick=()=>openCustomer(db.customers.find(x=>x.id===b.dataset.editC)));
$$('[data-prof-c]').forEach(b=>b.onclick=()=>openProfile(db.customers.find(x=>x.id===b.dataset.profC)));$$('[data-visit-c]').forEach(b=>b.onclick=()=>{let c=db.customers.find(x=>x.id===b.dataset.visitC);openVisit({customer:c.name})});
$$('[data-del-c]').forEach(b=>b.onclick=()=>{if(confirm('حذف العميل؟ لن يتم حذف الزيارات السابقة تلقائيًا.')){db.customers=db.customers.filter(x=>x.id!==b.dataset.delC);save();toast('تم حذف العميل')}});
$$('[data-del-v]').forEach(b=>b.onclick=()=>{if(confirm('حذف الزيارة؟')){db.visits=db.visits.filter(x=>x.id!==b.dataset.delV);save()}});
$$('[data-edit-t]').forEach(b=>b.onclick=()=>openTask(db.tasks.find(x=>x.id===b.dataset.editT)));
$$('[data-done]').forEach(b=>b.onclick=()=>{db.tasks=db.tasks.map(t=>t.id===b.dataset.done?{...t,status:'تمت'}:t);save();toast('تم إنجاز المهمة')});
$$('[data-del-t]').forEach(b=>b.onclick=()=>{if(confirm('حذف المهمة؟')){db.tasks=db.tasks.filter(x=>x.id!==b.dataset.delT);save()}});
$$('[data-edit-p]').forEach(b=>b.onclick=()=>openProduct(db.products.find(x=>x.id===b.dataset.editP)));
$$('[data-del-p]').forEach(b=>b.onclick=()=>{if(confirm('حذف المنتج؟')){db.products=db.products.filter(x=>x.id!==b.dataset.delP);save()}});
$$('[data-edit-o]').forEach(b=>b.onclick=()=>openOrder(db.orders.find(x=>x.id===b.dataset.editO)));
$$('[data-del-o]').forEach(b=>b.onclick=()=>{if(confirm('حذف المستند؟')){db.orders=db.orders.filter(x=>x.id!==b.dataset.delO);save()}});
bind('#clearData',()=>{if(confirm('هل أنت متأكد؟ سيتم حذف جميع البيانات المحلية نهائيًا.')){db={...initial};save();toast('تم مسح البيانات')}});
let file=$('#importFile');if(file)file.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.customers||!x.visits||!x.tasks)throw Error('invalid');if(confirm('استبدال البيانات الحالية بالنسخة المختارة؟')){db={...initial,...x};save();toast('تم استعادة البيانات')}}catch(err){alert('الملف غير صالح أو غير متوافق')}e.target.value=''};
}
function exportDataOld(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tgt-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز النسخة الاحتياطية')}
render();syncReminders();navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
</script>
</body>
</html>
